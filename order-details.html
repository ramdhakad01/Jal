<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details</title>
    <link rel="stylesheet" href="order-styles.css">
</head>
<body>
    <div class="order-details-page">
        <h1>Order Details</h1>
        
        <div class="order-info">
            <div class="order-info-box">
                <h3>Order Information</h3>
                <div class="info-row">
                    <div class="info-label">Order ID:</div>
                    <div class="info-value" id="order-id"></div>
                </div>
                <div class="info-row">
                    <div class="info-label">Order Date:</div>
                    <div class="info-value" id="order-date"></div>
                </div>
                <div class="info-row">
                    <div class="info-label">Payment Method:</div>
                    <div class="info-value" id="payment-method"></div>
                </div>
            </div>
            
            <div class="order-info-box">
                <h3>Shipping Address</h3>
                <div class="info-value" id="shipping-address"></div>
            </div>
        </div>
        
        <div class="order-items">
            <h3>Order Items</h3>
            <div class="item-list" id="item-list">
                <!-- Items will be added dynamically -->
            </div>
        </div>
        
        <div class="order-summary-box">
            <h3>Order Summary</h3>
            <div class="summary-row">
                <div>Subtotal</div>
                <div id="subtotal"></div>
            </div>
            <div class="summary-row">
                <div>Shipping</div>
                <div id="shipping-cost"></div>
            </div>
            <div class="summary-row total">
                <div>Total</div>
                <div id="total"></div>
            </div>
        </div>
        
        <button class="back-btn" onclick="goBack()">Back to Home</button>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Get order data from localStorage
            const orderData = JSON.parse(localStorage.getItem('orderData'));
            
            // Display order information
            document.getElementById('order-id').textContent = orderData.orderId;
            document.getElementById('order-date').textContent = new Date().toLocaleDateString();
            
            // Format payment method for display
            let paymentMethodText = 'Cash on Delivery';
            if (orderData.paymentMethod === 'cup') {
                paymentMethodText = 'Cash upon Delivery';
            }
            document.getElementById('payment-method').textContent = paymentMethodText;
            
            // Display shipping address
            const shipping = orderData.shipping;
            const addressHtml = `
                ${orderData.customer.firstName} ${orderData.customer.lastName}<br>
                ${shipping.street}<br>
                ${shipping.city}, ${shipping.state} ${shipping.pin}<br>
                ${shipping.country}<br>
                Phone: ${orderData.customer.fullPhone || orderData.customer.phone}
            `;
            document.getElementById('shipping-address').innerHTML = addressHtml;
            
            // Display order items
            const itemList = document.getElementById('item-list');
            orderData.items.forEach(item => {
                const itemTotal = item.price * item.quantity;
                const itemHtml = `
                    <div class="item">
                        <div class="item-image">
                            <img src="${item.image}" alt="${item.name}">
                        </div>
                        <div class="item-details">
                            <div class="item-name">${item.name}</div>
                            <div class="item-price">$${item.price}</div>
                            <div class="item-quantity">Quantity: ${item.quantity}</div>
                        </div>
                        <div class="item-total">$${itemTotal}</div>
                    </div>
                `;
                itemList.innerHTML += itemHtml;
            });
            
            // Display order summary
            document.getElementById('subtotal').textContent = `$${orderData.subtotal}`;
            document.getElementById('shipping-cost').textContent = `$${orderData.shippingCost}`;
            document.getElementById('total').textContent = `$${orderData.total}`;
        });
        
        function goBack() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
